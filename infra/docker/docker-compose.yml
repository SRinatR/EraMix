services:
  # Verified 2026-08-08 against a real Docker Engine on the production host
  # (docs/runbooks/deploy.md) — this file's own postgres volume path was
  # wrong (pre-18 convention) until that session caught it; see the
  # postgres.volumes comment below.
  #
  # Every `environment:` value below is a local-dev-only, throwaway
  # credential (matches .env.example's own comment) — never a real secret.
  # ADR-0016: dotenvx is a local/CI launch-time convenience only; it plays
  # no role here or in a real deployment. Production replaces every one of
  # these `environment:` blocks with values injected by the deployment
  # platform's secret store at container start, never a committed file.
  postgres:
    # ADR-0013: PostgreSQL 19 Beta 2 is mandatory for local/CI/staging/initial
    # production; 17/18 must never be a silent fallback. The exact image
    # digest still needs to be resolved and pinned here (requires `docker
    # pull`/`docker inspect`, deferred to the Raspberry Pi integration
    # environment per CLAUDE.md's laptop/Pi split) — tag-only for now.
    image: postgres:19beta2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eramix
      POSTGRES_PASSWORD: eramix_local_dev
      POSTGRES_DB: eramix
    ports:
      - '5432:5432'
    volumes:
      # PostgreSQL 18+ Docker images expect a single mount at
      # /var/lib/postgresql (data goes in a major-version-specific
      # subdirectory) — the pre-18 convention of mounting directly at
      # .../data is now explicitly rejected at startup as an "unused mount".
      - eramix-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eramix']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off migration gate: `docker compose --profile migrate run --rm migrate`.
  # Never part of the default `docker compose up` — migrations are an
  # explicit, auditable step, not a side effect of starting the stack.
  # Targets web.Dockerfile's `build` stage deliberately (not the pruned
  # runtime stage): `prisma migrate deploy` needs the `prisma` CLI, which is
  # a devDependency stripped by `pnpm deploy --prod` in the runtime image.
  migrate:
    profiles: ['migrate']
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      target: build
    environment:
      DATABASE_URL: postgresql://eramix:eramix_local_dev@postgres:5432/eramix
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['pnpm', '--filter', '@eramix/infrastructure', 'run', 'db:migrate:deploy']

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://eramix:eramix_local_dev@postgres:5432/eramix
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://eramix:eramix_local_dev@postgres:5432/eramix
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  eramix-postgres-data:
