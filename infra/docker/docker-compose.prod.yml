services:
  # ADR-0013: PostgreSQL 19 Beta 2, pinned by exact digest (resolved and
  # recorded in docs/runbooks/deploy.md — never a floating tag in
  # production). No `ports:` mapping: only the `web`/`worker`/`migrate`
  # containers reach it, over the compose-internal network — ufw on the
  # host also only allows 22/80/443, but this is defense in depth, not a
  # reliance on the firewall alone.
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be set to the pinned postgres@sha256:... digest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      # PostgreSQL 18+ Docker images expect a single mount at
      # /var/lib/postgresql (data goes in a major-version-specific
      # subdirectory) — the pre-18 convention of mounting directly at
      # .../data is now explicitly rejected at startup as an "unused mount".
      - eramix-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be set to ghcr.io/.../eramix-web:<tag>}
    restart: unless-stopped
    env_file: .env
    environment:
      # Verified live: without this, Next's standalone server.js binds only
      # to whatever process.env.HOSTNAME resolves to — Docker auto-sets
      # HOSTNAME to the container's own id/hostname, which /etc/hosts maps
      # to the container's bridge-network IP only, never 127.0.0.1. Caddy
      # (a separate container, reaching it via Docker DNS at that same
      # bridge IP) worked fine the whole time; only same-container
      # "localhost" connections — i.e. this container's own healthcheck —
      # got ECONNREFUSED. Binding to all interfaces fixes both.
      HOSTNAME: '0.0.0.0'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # wget (present in this Alpine-based image via busybox — verified
      # live) is far lighter than spawning a fresh Node interpreter per
      # check on a 1-vCPU/~1GB host under real load; the earlier
      # node -e fetch(...) healthcheck was intermittently exceeding its own
      # 5s timeout just from Node's own cold-start overhead.
      test: ['CMD', 'wget', '-qO-', '--tries=1', 'http://127.0.0.1:3000/health/ready']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE must be set to ghcr.io/.../eramix-worker:<tag>}
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  # Reverse proxy + automatic HTTPS (Let's Encrypt via ACME HTTP-01 on port
  # 80, matching ufw's allowed ports). Sets X-Forwarded-Proto, which
  # apps/web/src/server/request-protocol.ts's isSecureRequest depends on to
  # issue Secure session cookies correctly behind a TLS-terminating proxy.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - eramix-caddy-data:/data
      - eramix-caddy-config:/config
    depends_on:
      - web

volumes:
  eramix-postgres-data:
  eramix-caddy-data:
  eramix-caddy-config:
