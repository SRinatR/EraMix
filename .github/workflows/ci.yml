name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `prisma generate` (via db:generate) requires DATABASE_URL to be resolvable
# even though it never connects — prisma.config.ts's env('DATABASE_URL')
# throws if the variable is entirely unset. This placeholder is never used
# to actually reach a database in jobs that don't also define a postgres
# service (only db-migration does, and its job-level env below overrides
# this workflow-level default).
env:
  DATABASE_URL: postgresql://eramix:eramix_ci@localhost:5432/eramix

jobs:
  install:
    name: Clean install (pnpm 12 beta risk gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      # ADR-0011: Corepack itself has a confirmed, open upstream bug
      # (nodejs/corepack#873) fetching pnpm@12 alpha/beta releases — it
      # reports MODULE_NOT_FOUND because pnpm@12's new `preinstall` script
      # isn't handled correctly by Corepack's download/activate path.
      # Installing the exact pinned version directly via npm sidesteps
      # Corepack's shim entirely (deliberately not calling `corepack
      # enable`, which would reinstate the buggy shim on PATH ahead of
      # this binary) while still running the identical, exactly-pinned
      # pnpm@12.0.0-beta.2 CLAUDE.md requires.
      - name: Install pnpm (bypassing Corepack — ADR-0011)
        run: npm install -g pnpm@12.0.0-beta.2
      - name: Install dependencies with a frozen, verified lockfile
        run: pnpm install --frozen-lockfile

  source:
    name: Source (format, lint, typecheck)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - run: npm install -g pnpm@12.0.0-beta.2
      # Caching pnpm's content-addressable store (not node_modules — a
      # prior attempt caching/restoring node_modules across jobs failed
      # ("/usr/bin/tar" exit 2 on restore, reproducibly, likely pnpm's
      # isolated-linker symlink layout not round-tripping through the
      # cache action's tar archive) is the standard, documented pnpm+CI
      # pattern: each job still runs its own `pnpm install
      # --frozen-lockfile`, but it's fast because packages are already in
      # the cached store.
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      # packages/infrastructure/src/generated/ is gitignored (Prisma's own
      # generated output, per Prisma 7's explicit-output-path requirement)
      # — every job that builds/tests/typechecks it must regenerate it
      # first, offline, no database connection required.
      - run: pnpm --filter @eramix/infrastructure run db:generate
      - run: pnpm run format
      - run: pnpm run lint
      - run: pnpm run typecheck

  unit:
    name: Unit tests
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - run: npm install -g pnpm@12.0.0-beta.2
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eramix/infrastructure run db:generate
      # apps/web and apps/worker's own tests import the other workspace
      # packages via their built dist/ output (each package.json's
      # main/exports point at ./dist), not TypeScript source directly — so
      # a fresh checkout needs them built first. This was masked all
      # session locally because dist/ was already present from earlier
      # `pnpm run build` runs.
      - run: pnpm run build
      - run: pnpm run test

  build:
    name: Production build
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - run: npm install -g pnpm@12.0.0-beta.2
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eramix/infrastructure run db:generate
      - run: pnpm run build

  security:
    name: Dependency + secret scan
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - run: npm install -g pnpm@12.0.0-beta.2
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      # ADR-0015: audit-level=critical is a deliberate, documented threshold
      # (not a bypass) — 3 high/1 moderate findings are currently transitive
      # to the pinned next@16.2.12 itself and tracked there, re-reviewed on
      # the next Next.js upgrade.
      - name: pnpm audit (dependency vulnerabilities, ADR-0015)
        run: pnpm audit --audit-level=critical
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  db-migration:
    name: Migration gate + real-PostgreSQL integration tests
    needs: install
    runs-on: ubuntu-latest
    # ADR-0013: PostgreSQL 19 Beta 2 is mandatory; the exact image digest is
    # still pending (Pi session pulls/inspects it). Tag-only here, same as
    # infra/docker/docker-compose.yml.
    services:
      postgres:
        image: postgres:19beta2-alpine
        env:
          POSTGRES_USER: eramix
          POSTGRES_PASSWORD: eramix_ci
          POSTGRES_DB: eramix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eramix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://eramix:eramix_ci@localhost:5432/eramix
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - run: npm install -g pnpm@12.0.0-beta.2
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eramix/infrastructure run db:generate
      - name: Apply migrations from empty (Phase 1 exit criterion)
        run: pnpm --filter @eramix/infrastructure run db:migrate:deploy
      # The integration test imports @eramix/domain/@eramix/application by
      # their built dist/ output (package.json main/exports), not source.
      - run: pnpm --filter @eramix/infrastructure... run build
      - name: Real-PostgreSQL repository/transaction integration tests
        run: pnpm --filter @eramix/infrastructure run test:integration

  docker-build:
    name: Container image build (no push)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build apps/web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          tags: eramix-web:ci
      - name: Build apps/worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          push: false
          tags: eramix-worker:ci
