openapi: 3.2.0
info:
  title: EraMix B2B API
  version: 0.1.0
  license:
    name: Proprietary
  description: >
    Source-of-truth contract for the EraMix B2B platform. Endpoint groups are
    added incrementally as their owning phase is implemented (see
    docs/IMPLEMENTATION_ROADMAP.md). Do not hand-author public URLs or error
    shapes outside this document and the generated types in
    packages/contracts.
servers:
  - url: /
tags:
  - name: System
    description: Liveness and readiness probes.
  - name: Auth
    description: >-
      OIDC Authorization Code + PKCE session endpoints. The concrete ODS
      issuer/claim contract is blocked on Q-01/ADR-0003; these operations are
      the generic RFC 9700 + OIDC Core flow shape.
  - name: Catalog
    description: Public category/product browse and search (TZ §3.1 "Публичный каталог").
  - name: Content
    description: Public articles, pages, and FAQ.
  - name: Orders
    description: Quote-only B2B order lifecycle (ADR-0005).
  - name: Admin
    description: Administrator-only users/roles management (TZ §3.1 "Пользователи и роли").
  - name: Media
    description: >-
      Catalog/content asset upload and controlled download (content.write
      permission). The concrete object-storage provider is blocked on
      Q-06/ADR-0006; the current implementation is a dev-only local-disk
      stand-in behind the same StorageProvider port.
  - name: Product Assets
    description: >-
      Product image/document attachments (catalog.write for admin
      mutations). Metadata (packages/infrastructure/prisma/schema.prisma's
      ProductAsset) is stored separately from the binary, which lives only in
      the StorageProvider port; downloads are always a time-limited signed
      redirect, never a permanent public object URL or the internal storage
      key. Malware-scan status/engine are recorded honestly — the current
      scanner is a documented dev stand-in, never claimed as production
      antivirus coverage (see ADR-0006).
security:
  - sessionCookie: []
paths:
  /health/live:
    get:
      operationId: getHealthLive
      summary: Liveness probe
      tags: [System]
      security: []
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /health/ready:
    get:
      operationId: getHealthReady
      summary: Readiness probe
      tags: [System]
      security: []
      responses:
        '200':
          description: The process is ready to accept traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: A required dependency is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/auth/login:
    get:
      operationId: getAuthLogin
      summary: Start the OIDC Authorization Code + PKCE flow
      description: >-
        Builds the authorization request (state, nonce, PKCE challenge),
        stores them server-side against the pending session, and redirects
        to the identity provider. No claims are trusted until /auth/callback
        validates the returned token.
      tags: [Auth]
      security: []
      responses:
        '302':
          description: Redirect to the identity provider's authorization endpoint.
  /api/auth/callback:
    get:
      operationId: getAuthCallback
      summary: OIDC callback — exchange code for validated claims and establish a session
      tags: [Auth]
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Session cookie set; redirect to the post-login destination.
        '401':
          description: State/nonce/PKCE/signature/issuer/audience/expiry validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/auth/logout:
    post:
      operationId: postAuthLogout
      summary: Clear the local session
      tags: [Auth]
      responses:
        '204':
          description: Session cleared.
  /api/auth/session:
    get:
      operationId: getAuthSession
      summary: Current session's user/role/company membership
      tags: [Auth]
      responses:
        '200':
          description: The current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: No valid session.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/catalog/categories:
    get:
      operationId: listCatalogCategories
      summary: List published categories
      tags: [Catalog]
      security: []
      parameters:
        - name: locale
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/LocaleCode'
        - name: parentId
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Published categories for the requested locale.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
  /api/catalog/products:
    get:
      operationId: listCatalogProducts
      summary: Search/browse published products
      tags: [Catalog]
      security: []
      parameters:
        - name: locale
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/LocaleCode'
        - name: categoryId
          in: query
          required: false
          schema: { type: string }
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Paginated published products.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
  /api/catalog/products/{publicId}:
    get:
      operationId: getCatalogProduct
      summary: Resolve a published product by its immutable publicId
      description: >-
        Resolution is always by publicId (ADR-0010); a stale slug in the
        canonical URL is a client-side 308 redirect, not a 404 here.
      tags: [Catalog]
      security: []
      parameters:
        - name: publicId
          in: path
          required: true
          schema: { type: string }
        - name: locale
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/LocaleCode'
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Unknown publicId, unpublished product, or no translation for the locale.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/catalog/products/{publicId}/assets/{assetId}/download:
    get:
      operationId: downloadProductAsset
      summary: Download a product image/document
      description: >-
        PUBLISHED assets are downloadable by anyone; DRAFT/ARCHIVED assets
        require an authenticated caller with catalog.write (admin preview) —
        an unauthorized request gets the same 404 as a genuinely unknown
        asset, never a 403 that would confirm the asset exists. Redirects to
        a time-limited signed URL carrying a safe, editorial
        Content-Disposition filename, never the internal storage key.
      tags: [Product Assets]
      security: []
      parameters:
        - name: publicId
          in: path
          required: true
          schema: { type: string }
        - name: assetId
          in: path
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirect to a time-limited signed download URL.
        '404':
          description: Unknown product, unknown asset, or (unauthenticated/unauthorized) an unpublished asset.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/content/{type}:
    get:
      operationId: listContent
      summary: List published content (articles, pages, or FAQ items)
      tags: [Content]
      security: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [articles, pages, faq]
        - name: locale
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/LocaleCode'
      responses:
        '200':
          description: Published content items.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContentItem'

  /api/orders:
    get:
      operationId: listOrders
      summary: List orders visible to the caller
      description: >-
        A customer sees every ACTIVE company they belong to by default (a
        true cross-company page, never silently narrowed to one company) —
        order.read.own; a manager/admin sees all orders across every
        company — order.read.all. TZ ORD-008. ACC-003: bounded, paginated,
        filterable by status/date, sortable.
      tags: [Orders]
      parameters:
        - name: companyId
          in: query
          required: false
          description: >-
            Narrows to one company. For a customer, must be one of the
            caller's own ACTIVE memberships — otherwise 403, identical to
            requesting any other unauthorized resource.
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: createdFrom
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: createdTo
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [createdAt_asc, createdAt_desc], default: createdAt_desc }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Paginated orders.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
    post:
      operationId: createDraftOrder
      summary: Create a DRAFT order (quote-only, no price snapshot)
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: The created draft order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/orders/{orderNumber}:
    get:
      operationId: getOrder
      summary: Get an order by its public order number
      tags: [Orders]
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/orders/by-id/{orderId}/lines:
    post:
      operationId: addOrderLine
      summary: Add a line to a DRAFT order
      tags: [Orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOrderLineRequest'
      responses:
        '200':
          description: The updated order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '409':
          description: Order is no longer DRAFT (ORD-006), or a stale version was supplied.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/orders/by-id/{orderId}/lines/{lineId}:
    delete:
      operationId: removeOrderLine
      summary: Remove a line from a DRAFT order
      tags: [Orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
        - name: lineId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveOrderLineRequest'
      responses:
        '200':
          description: The updated order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '409':
          description: Order is no longer DRAFT (ORD-006), or a stale version was supplied.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/orders/by-id/{orderId}/submit:
    post:
      operationId: submitOrder
      summary: Submit a DRAFT order (DRAFT -> SUBMITTED)
      description: Idempotent via the required Idempotency-Key header.
      tags: [Orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOrderRequest'
      responses:
        '200':
          description: The submitted order (or the already-submitted order, if this Idempotency-Key was replayed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '409':
          description: Order is not DRAFT, has no lines, a stale version, or the Idempotency-Key was reused for a different order.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/orders/by-id/{orderId}/transition:
    post:
      operationId: transitionOrderStatus
      summary: Transition an order's status (state machine + RBAC + version — ORD-007)
      tags: [Orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionOrderRequest'
      responses:
        '200':
          description: The order in its new status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '409':
          description: >-
            Transition not allowed from the current status, a stale version,
            or (post-CONFIRMED cancellation) a missing reason.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/orders/by-id/{orderId}/comments:
    get:
      operationId: listOrderComments
      summary: List an order's comments (ORD-008/ACC-004/TZ §6.6)
      description: >-
        INTERNAL comments are filtered out for any actor lacking
        order.transition (i.e. every CUSTOMER) — never client-side, always
        server-side.
      tags: [Orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Comments visible to the caller, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderComment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
    post:
      operationId: addOrderComment
      summary: Add a comment to an order
      description: >-
        visibility: INTERNAL requires order.transition (manager/admin only);
        a CUSTOMER may only post PUBLIC comments.
      tags: [Orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOrderCommentRequest'
      responses:
        '201':
          description: The created comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderComment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '422':
          description: Blank comment body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/admin/users:
    get:
      operationId: listAdminUsers
      summary: List platform users (users.manage — Administrator only)
      description: ADM-002/DB-005 — bounded, paginated, optional email/displayName substring search.
      tags: [Admin]
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Paginated users.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUser'
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
  /api/admin/users/{userId}/role:
    patch:
      operationId: updateUserPlatformRole
      summary: Change a user's platform role (users.manage — Administrator only)
      tags: [Admin]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platformRole, expectedVersion]
              properties:
                platformRole:
                  $ref: '#/components/schemas/PlatformRole'
                expectedVersion: { type: integer }
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '409':
          description: Stale version (concurrency conflict).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/admin/companies:
    get:
      operationId: listAdminCompanies
      summary: List companies (users.manage — Administrator only)
      description: >-
        TZ §3.1's RBAC matrix has no separate "Компании" resource; company
        data belongs to the same Identity & Access module as users/roles
        (§4.2), so this reuses the existing users.manage permission rather
        than introducing a new one.
      tags: [Admin]
      responses:
        '200':
          description: Companies.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
    post:
      operationId: createCompany
      summary: Create a company (users.manage — Administrator only)
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
      responses:
        '201':
          description: The created company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
  /api/admin/companies/{companyId}/status:
    patch:
      operationId: updateCompanyStatus
      summary: Suspend or reactivate a company (users.manage — Administrator only)
      tags: [Admin]
      parameters:
        - name: companyId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyStatusRequest'
      responses:
        '200':
          description: The updated company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '409':
          description: Stale version (concurrency conflict).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/admin/companies/{companyId}/memberships:
    get:
      operationId: listCompanyMemberships
      summary: List a company's memberships (users.manage — Administrator only)
      tags: [Admin]
      parameters:
        - name: companyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Memberships.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Membership'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
    post:
      operationId: createMembership
      summary: Add a user to a company (users.manage — Administrator only)
      tags: [Admin]
      parameters:
        - name: companyId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMembershipRequest'
      responses:
        '201':
          description: The created membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          description: Company or user not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/admin/companies/{companyId}/memberships/{membershipId}/status:
    patch:
      operationId: updateMembershipStatus
      summary: Change a membership's status (users.manage — Administrator only)
      tags: [Admin]
      parameters:
        - name: companyId
          in: path
          required: true
          schema: { type: string }
        - name: membershipId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMembershipStatusRequest'
      responses:
        '200':
          description: The updated membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '409':
          description: Stale version (concurrency conflict).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/admin/categories/{categoryId}/status:
    patch:
      operationId: transitionCategoryStatus
      summary: >-
        Transition a category's publication status (catalog.write —
        Administrator only). Publishing validates that every translation has
        seoTitle, seoDescription, and a canonical route first (Phase 6 exit
        criterion); unpublishing (DRAFT/ARCHIVED) is never gated.
      tags: [Admin]
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string }
