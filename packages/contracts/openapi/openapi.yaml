        - name: action
          in: query
          required: false
          schema: { type: string }
        - name: actorUserId
          in: query
          required: false
          schema: { type: string }
        - name: createdFrom
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: createdTo
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [createdAt_asc, createdAt_desc], default: createdAt_desc }
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
