    get:
      operationId: getOfferEligibility
      summary: >-
        Per-offer eligibility reasons for the admin operational view
        (settings.manage — ADMIN only, ADR-0019). `MERCHANT_CENTER_DISABLED`
        is always present while PlatformSettings.merchantCenterEnabled stays
        hard-false — no offer can ever be eligible in this phase.
      tags: [Offers]
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The offer's eligibility state and reasons.
          content:
            application/json:
              schema:
                type: object
                required: [offerId, eligible, ineligibilityReasons]
                properties:
                  offerId: { type: string }
                  eligible: { type: boolean }
                  ineligibilityReasons:
                    type: array
                    items:
                      $ref: '#/components/schemas/OfferIneligibilityReason'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /api/admin/products/{productId}/direct-sale:
    patch:
      operationId: setProductDirectSaleEnabled
      summary: >-
        Explicit per-product opt-in into direct-sale mode (settings.manage —
        ADMIN only, ADR-0019). Required before any of the product's offers
        can ever publish; flipping this alone never syndicates anything —
        PlatformSettings.merchantCenterEnabled remains the separate,
        hard-false gate.
      tags: [Offers]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [directSaleEnabled, expectedVersion]
              properties:
                directSaleEnabled: { type: boolean }
                expectedVersion: { type: integer }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: The product's updated direct-sale flag.
          content:
            application/json:
              schema:
                type: object
                required: [id, directSaleEnabled, version]
                properties:
                  id: { type: string }
                  directSaleEnabled: { type: boolean }
                  version: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Stale version.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '400':
          $ref: '#/components/responses/MalformedRequest'

  /api/analytics/events:
    post:
      operationId: recordAnalyticsEvents
      summary: >-
        Ingest a batch of consent-gated product-interest/conversion events
        (CLAUDE.md/docs/runbooks/search-visibility.md's shared event
        library). Public and unauthenticated — the caller is an anonymous
        visitor's browser. All-or-nothing: the first invalid event in the
        batch rejects the whole request. Each event's own self-reported
        `consent` state (not this endpoint) decides whether apps/worker
        later forwards it to GA4/Yandex Metrica/Rust analytics — this
        endpoint only validates and durably enqueues.
      tags: [Analytics]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordAnalyticsEventsRequest'
      responses:
        '202':
          description: Accepted for asynchronous dispatch (no response body).
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: Rate limit exceeded for the "analytics" bucket.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '400':
          $ref: '#/components/responses/MalformedRequest'

  /api/media:
    post:
      operationId: uploadMedia
      summary: Upload a catalog/content media asset (content.write)
      tags: [Media]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: The stored asset descriptor and a time-limited signed download URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaDescriptor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: >-
            Rejected by validation (extension mismatch, signature mismatch)
            or malware scanning.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '400':
          $ref: '#/components/responses/MalformedRequest'
  /api/media/download:
    get:
      operationId: downloadMedia
      summary: Download a previously uploaded asset via a signed URL
      tags: [Media]
      security: []
      parameters:
        - name: key
          in: query
          required: true
          schema: { type: string }
        - name: expires
          in: query
          required: true
          schema: { type: integer }
        - name: sig
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The file content.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403':
          description: Signature invalid, tampered with, or expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: eramix_session
      description: >-
        Secure, HttpOnly, SameSite session cookie set by /auth/callback.
        Browser JavaScript never has access to the underlying OIDC tokens.
  parameters:
    CursorParam:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque pagination cursor from a previous response's
        `page.nextCursor` (ADR-0017). Never hand-constructed.
      schema: { type: string }
    LimitParam:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Unauthorized:
      description: No valid session (AUTH_REQUIRED).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    AccessDenied:
      description: Session valid but lacks the required permission (IAM-008).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Resource not found, or hidden by access-control policy.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationFailed:
      description: Request failed input validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PayloadTooLarge:
      description: Uploaded file exceeds the allowed size.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnsupportedMediaType:
      description: Uploaded file's declared content type is not in the allowlist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    MalformedRequest:
      description: Request body could not be parsed as JSON (distinct from a well-formed but invalid body, which is 422).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    MethodNotAllowed:
      description: HTTP method is not supported on this endpoint. The response carries an `Allow` header listing the supported methods.
      headers:
        Allow:
          description: Comma-separated list of the methods this endpoint actually implements.
          schema: { type: string }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    LocaleCode:
      type: string
      description: MVP locale allowlist (ADR-0010); en is the default locale.
      enum: [en, ru, uz]
    PlatformRole:
      type: string
      description: Platform-wide staff/customer role (ADR-0014, TZ §3.1 RBAC matrix).
      enum: [CUSTOMER, MANAGER, CONTENT_EDITOR, ADMIN, AUDITOR]
    CursorPageInfo:
      type: object
      description: >-
        ADR-0017/API-005: forward-only keyset pagination. `nextCursor` is an
        opaque, base64url-encoded token — clients must never decode or
        construct it, only echo it back as the `cursor` query parameter of
        the next request. There is no `prevCursor` and no `total`; a list's
        total size is not computed.
      required: [hasMore]
      properties:
        nextCursor: { type: string }
        hasMore: { type: boolean }
    Session:
      type: object
      required: [userId, email, displayName, platformRole, companyIds]
      properties:
        userId: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        platformRole:
          $ref: '#/components/schemas/PlatformRole'
        companyIds:
          type: array
          items: { type: string }
    AdminUser:
      type: object
      required: [id, email, displayName, platformRole, status, version]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        platformRole:
          $ref: '#/components/schemas/PlatformRole'
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        version: { type: integer }
    Company:
      type: object
      required: [id, legalName, status, version]
      properties:
        id: { type: string }
        legalName: { type: string }
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
        metadata:
          description: >-
            Untyped bucket for jurisdiction-specific registration fields
            pending a business decision (docs/OPEN_QUESTIONS.md Q-09).
          type: object
        version: { type: integer }
    CreateCompanyRequest:
      type: object
      required: [legalName]
      properties:
        legalName: { type: string, minLength: 1, maxLength: 255 }
        metadata: { type: object }
    UpdateCompanyStatusRequest:
      type: object
      required: [status, expectedVersion]
      properties:
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
        expectedVersion: { type: integer }
    CompanyRole:
      type: string
      enum: [OWNER, MEMBER]
    MembershipStatus:
      type: string
      enum: [ACTIVE, INVITED, REVOKED]
    Membership:
      type: object
      required: [id, userId, companyId, role, status, version]
      properties:
        id: { type: string }
        userId: { type: string }
        companyId: { type: string }
        role:
          $ref: '#/components/schemas/CompanyRole'
        status:
          $ref: '#/components/schemas/MembershipStatus'
        version: { type: integer }
    CreateMembershipRequest:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string }
        role:
          $ref: '#/components/schemas/CompanyRole'
    UpdateMembershipStatusRequest:
      type: object
      required: [status, expectedVersion]
      properties:
        status:
          $ref: '#/components/schemas/MembershipStatus'
        expectedVersion: { type: integer }
    PublicationStatus:
      type: string
      description: >-
        Category/Content/Product lifecycle status. Publishing is gated
        (Phase 6 exit criterion: required SEO fields, canonical route, and
        slug uniqueness must hold first); DRAFT/ARCHIVED are never gated.
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    PublicationStatusUpdate:
      type: object
      required: [toStatus, expectedVersion]
      properties:
        toStatus:
          $ref: '#/components/schemas/PublicationStatus'
        expectedVersion: { type: integer }
    PublicationTransitionResult:
      type: object
      required: [id, status, version]
      properties:
        id: { type: string }
        status:
          $ref: '#/components/schemas/PublicationStatus'
        version: { type: integer }
    RetireRequest:
      type: object
      required: [reason, expectedVersion]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: >-
            Required, real reason recorded on the audit trail — never blank.
        expectedVersion: { type: integer }
        successorId:
          type: string
          minLength: 1
          description: >-
            Optional id of an existing, different, currently PUBLISHED entity
            of the same type (search-visibility.md: "a 308 is used only for a
            materially equivalent canonical replacement"). When set, the
            public route returns a one-hop 308 to the successor's live
            canonical URL instead of 410 — re-checked on every request, never
            frozen at retirement time.
    RetireResult:
      type: object
      required: [id, status, version]
      properties:
        id: { type: string }
        status:
          $ref: '#/components/schemas/PublicationStatus'
        retiredAt: { type: string, format: date-time }
        retirementReason: { type: string }
        successorId: { type: [string, 'null'] }
        version: { type: integer }
    AuditEvent:
      type: object
      required: [id, action, entityType, entityId, createdAt]
      properties:
        id: { type: string }
        actorUserId: { type: string }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        metadata:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
    MediaDescriptor:
      type: object
      required: [key, contentType, sizeBytes, checksumSha256, downloadUrl]
      properties:
        key: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        checksumSha256: { type: string }
        downloadUrl:
          type: string
          description: Time-limited signed download URL (1 hour).
    ProductIndicativePrice:
      type: object
      description: >-
        Non-binding, display-only "from" price (ADR-0005). This is never a
        binding offer or payable total; OrderLine carries no price field in
        MVP — final commercial terms are confirmed manually by a manager
        after order submission (quote-only workflow). Both fields are
        present together or absent together.
      properties:
        priceFromMinor:
          type: integer
          minimum: 0
          description: Indicative amount in minor currency units (e.g. cents/tiyin).
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217 currency code; required whenever priceFromMinor is set.
        priceMode:
          type: string
          enum: [FROM_PRICE_INDICATIVE]
        priceDisclaimer:
          type: string
          description: Localized non-binding disclaimer text (e.g. "от", "starting from").
    Category:
      type: object
      required: [id, slug, name, status]
      properties:
        id: { type: string }
        parentId: { type: string }
        slug: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [PUBLISHED]
    Product:
      type: object
      required: [publicId, sku, slug, name, status]
      properties:
        publicId: { type: string }
        sku: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [PUBLISHED]
        indicativePrice:
          $ref: '#/components/schemas/ProductIndicativePrice'
    ContentItem:
      type: object
      required: [id, slug, title, status]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        status:
          type: string
          enum: [PUBLISHED]
    OrderLine:
      type: object
      required: [id, productId, productNameSnapshot, productSkuSnapshot, quantity]
      properties:
        id: { type: string }
        productId: { type: string }
        productNameSnapshot: { type: string }
        productSkuSnapshot: { type: string }
        quantity: { type: integer, minimum: 1 }
        note: { type: string }
    OrderStatus:
      type: string
      enum:
        - DRAFT
        - SUBMITTED
        - UNDER_REVIEW
        - WAITING_CONFIRMATION
        - CONFIRMED
        - IN_PREPARATION
        - READY_FOR_PICKUP
        - READY_FOR_DELIVERY
        - COMPLETED
        - CANCELLED
    Order:
      type: object
      required: [id, orderNumber, companyId, status, version, lines]
      properties:
        id: { type: string }
        orderNumber: { type: string }
        companyId: { type: string }
        status:
          $ref: '#/components/schemas/OrderStatus'
        version: { type: integer }
        contactName: { type: string }
        contactPhone: { type: string }
        contactEmail: { type: string }
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
    CreateOrderRequest:
      type: object
      required: [companyId, lines]
      properties:
        companyId: { type: string }
        contactName: { type: string }
        contactPhone: { type: string }
        contactEmail: { type: string }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: string }
              quantity: { type: integer, minimum: 1 }
              note: { type: string }
    AddOrderLineRequest:
      type: object
      required: [expectedVersion, productId, quantity]
      properties:
        expectedVersion: { type: integer }
        productId: { type: string }
        quantity: { type: integer, minimum: 1 }
        note: { type: string }
    RemoveOrderLineRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer }
    SubmitOrderRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer }
    TransitionOrderRequest:
      type: object
      required: [expectedVersion, toStatus]
      properties:
        expectedVersion: { type: integer }
        toStatus:
          $ref: '#/components/schemas/OrderStatus'
        reason: { type: string }
    CommentVisibility:
      type: string
      enum: [PUBLIC, INTERNAL]
    OrderComment:
      type: object
      required: [id, orderId, authorId, visibility, body, createdAt]
      properties:
        id: { type: string }
        orderId: { type: string }
        authorId: { type: string }
        visibility:
          $ref: '#/components/schemas/CommentVisibility'
        body: { type: string, maxLength: 2000 }
        createdAt: { type: string, format: date-time }
    AddOrderCommentRequest:
      type: object
      required: [body, visibility]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
        visibility:
          $ref: '#/components/schemas/CommentVisibility'
    ProblemDetailsFieldError:
      type: object
      required: [pointer, code, message]
      properties:
        pointer:
          type: string
        code:
          type: string
        message:
          type: string
    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details, extended with EraMix-specific fields.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine-readable EraMix error code.
          enum:
            - AUTH_REQUIRED
            - AUTH_CALLBACK_FAILED
            - ACCESS_DENIED
            - COMPANY_REQUIRED
            - RESOURCE_NOT_FOUND
            - VALIDATION_FAILED
            - ORDER_STATE_CONFLICT
            - CONCURRENCY_CONFLICT
            - IDEMPOTENCY_CONFLICT
            - RATE_LIMITED
            - DEPENDENCY_UNAVAILABLE
            - INTERNAL_ERROR
            - SLUG_CONFLICT
            - LOCALE_NOT_SUPPORTED
            - CANONICAL_ROUTE_MISSING
            - MALFORMED_REQUEST
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - METHOD_NOT_ALLOWED
        traceId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ProblemDetailsFieldError'
    ChangeSlugRequest:
      type: object
      required: [locale, newSlug]
      properties:
        locale:
          $ref: '#/components/schemas/LocaleCode'
        newSlug: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1 }
    ChangeContentSlugRequest:
      type: object
      required: [locale, namespace, newSlug]
      properties:
        locale:
          $ref: '#/components/schemas/LocaleCode'
        namespace:
          type: string
          enum: [ARTICLES, PAGES]
        newSlug: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1 }
    ChangeSlugResult:
      type: object
      required: [slug, isCanonical]
      properties:
        slug: { type: string }
        isCanonical: { type: boolean }
    CategoryTranslationInput:
      type: object
      required: [locale, name]
      properties:
        locale:
          $ref: '#/components/schemas/LocaleCode'
        name: { type: string, minLength: 1 }
        seoTitle: { type: string, minLength: 1 }
        seoDescription: { type: string, minLength: 1 }
        slug:
          type: string
          minLength: 1
          description: When set, becomes this translation's initial canonical route.
    CategoryTranslationEditRequest:
      type: object
      description: >-
        Editable fields for an existing translation. Never includes `slug` —
        slug changes stay the separate changeCategorySlug command. Omitting a
        field leaves it unchanged; setting seoTitle/seoDescription to null
        clears it (rejected with 422 if the category is PUBLISHED).
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer }
        name: { type: string, minLength: 1 }
        seoTitle:
          type: [string, 'null']
        seoDescription:
          type: [string, 'null']
    TranslationEditResult:
      type: object
      required: [translationId, version]
      properties:
        translationId: { type: string }
        version:
          type: integer
          description: The translation's own new version, for the next edit's expectedVersion.
    CreateCategoryRequest:
      type: object
      required: [translations]
      properties:
        parentId: { type: string }
        sortOrder: { type: integer }
        translations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CategoryTranslationInput'
    ProductTranslationInput:
      type: object
      required: [locale, name, slug]
      properties:
        locale:
          $ref: '#/components/schemas/LocaleCode'
        name: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        seoTitle: { type: string, minLength: 1 }
        seoDescription: { type: string, minLength: 1 }
        indicativePrice:
          $ref: '#/components/schemas/ProductIndicativePrice'
    ProductTranslationEditRequest:
      type: object
      description: >-
        Editable fields for an existing translation. Never includes `slug` —
        slug changes stay a separate command. Omitting a field leaves it
        unchanged; setting a nullable field to null clears it (indicativePrice:
        null clears the price entirely). Clearing seoTitle/seoDescription is
        rejected with 422 if the product is PUBLISHED.
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer }
        name: { type: string, minLength: 1 }
        description:
          type: [string, 'null']
        seoTitle:
          type: [string, 'null']
        seoDescription:
          type: [string, 'null']
        indicativePrice:
          anyOf:
            - $ref: '#/components/schemas/ProductIndicativePrice'
            - type: 'null'
    CreateProductRequest:
      type: object
      required: [sku, categoryId, translations]
      properties:
        sku: { type: string, minLength: 1 }
        categoryId: { type: string }
        translations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProductTranslationInput'
    CreateProductResult:
      type: object
      required: [id, publicId, status, version]
      properties:
        id: { type: string }
        publicId: { type: string }
        status:
          $ref: '#/components/schemas/PublicationStatus'
        version: { type: integer }
    ContentType:
      type: string
      description: >-
        FAQ_ITEM has no per-item route (TZ Appendix F.3) — a slug is only
        valid for ARTICLE/PAGE translations.
      enum: [ARTICLE, PAGE, FAQ_ITEM]
    ContentBody:
      description: >-
        A single paragraph, or an ordered list of paragraphs, rendered as
        plain text (no HTML/markdown in the MVP body format).
      oneOf:
        - type: string
          minLength: 1
        - type: array
          minItems: 1
          items: { type: string, minLength: 1 }
    ContentTranslationInput:
      type: object
      required: [locale, title, content]
      properties:
        locale:
          $ref: '#/components/schemas/LocaleCode'
        title: { type: string, minLength: 1 }
        summary: { type: string, minLength: 1 }
        content:
          $ref: '#/components/schemas/ContentBody'
        seoTitle: { type: string, minLength: 1 }
        seoDescription: { type: string, minLength: 1 }
        slug:
          type: string
          minLength: 1
          description: Only valid for ARTICLE/PAGE translations.
    ContentTranslationEditRequest:
      type: object
      description: >-
        Editable fields for an existing translation. Never includes `slug` —
        slug changes stay the separate changeContentSlug command. Omitting a
        field leaves it unchanged; setting summary/seoTitle/seoDescription to
        null clears it (rejected with 422 if the content item is PUBLISHED).
        `content` (the body) is never nullable — omit it to leave the body
        unchanged, or supply a full replacement.
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer }
        title: { type: string, minLength: 1 }
        summary:
          type: [string, 'null']
        content:
          $ref: '#/components/schemas/ContentBody'
        seoTitle:
          type: [string, 'null']
        seoDescription:
          type: [string, 'null']
    CreateContentRequest:
      type: object
      required: [type, translations]
      properties:
        type:
          $ref: '#/components/schemas/ContentType'
        translations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ContentTranslationInput'
    CreateContentResult:
      type: object
      required: [id, type, status, version]
      properties:
        id: { type: string }
        type:
          $ref: '#/components/schemas/ContentType'
        status:
          $ref: '#/components/schemas/PublicationStatus'
        version: { type: integer }
    ProductAssetType:
      type: string
      enum: [IMAGE, DOCUMENT]
    MalwareScanStatus:
      type: string
      description: >-
        Only ever CLEAN in the persisted record — an INFECTED scan result is
        rejected before a ProductAsset row is ever created.
      enum: [CLEAN, INFECTED]
    ProductAsset:
      type: object
      required:
        - id
        - productId
        - assetType
        - status
        - originalFilename
        - displayName
        - contentType
        - sizeBytes
        - checksumSha256
        - sortOrder
        - malwareScanStatus
        - malwareScanEngine
        - version
        - createdAt
        - updatedAt
      properties:
        id: { type: string }
        productId: { type: string }
        assetType:
          $ref: '#/components/schemas/ProductAssetType'
        status:
          $ref: '#/components/schemas/PublicationStatus'
        originalFilename: { type: string }
        displayName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        checksumSha256: { type: string }
        locale:
          $ref: '#/components/schemas/LocaleCode'
        altText: { type: string }
        caption: { type: string }
        sortOrder: { type: integer }
        malwareScanStatus:
          $ref: '#/components/schemas/MalwareScanStatus'
        malwareScanEngine:
          type: string
          description: >-
            Honest scan-engine provenance string (e.g. "dev-stub, not
            production-grade") — never implies certified antivirus coverage
            unless a real scanner is wired (ADR-0006).
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UpdateProductAssetMetadataRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer }
        displayName: { type: string, minLength: 1 }
        altText:
          type: [string, 'null']
          description: null clears the field.
        caption:
          type: [string, 'null']
          description: null clears the field.
        locale:
          description: null clears the field.
          anyOf:
            - $ref: '#/components/schemas/LocaleCode'
            - type: 'null'
    PlatformSettings:
      type: object
      description: >-
        Never includes a secret value — only non-secret verification
        tokens/IDs and enabled/disabled flags (docs/runbooks/
        search-visibility.md's settings table).
      required:
        - canonicalHost
        - forceHttps
        - stripTrailingSlash
        - crawlerGlobalNoindex
        - googleExtendedAllowed
        - aiCompatibilityFilesEnabled
        - analyticsConsentRequired
        - ga4Enabled
        - yandexMetricaEnabled
        - rustAnalyticsEnabled
        - indexNowEnabled
        - merchantCenterEnabled
        - updatedAt
        - version
      properties:
        canonicalHost: { type: string }
        forceHttps: { type: boolean }
        stripTrailingSlash: { type: boolean }
        organizationName: { type: [string, 'null'] }
        organizationLegalName: { type: [string, 'null'] }
        organizationEmail: { type: [string, 'null'] }
        organizationPhone: { type: [string, 'null'] }
        organizationAddress: { type: [string, 'null'] }
        organizationSameAs:
          type: [array, 'null']
          items: { type: string }
        seoDefaultTitleTemplate: { type: [string, 'null'] }
        seoDefaultDescriptionFallback: { type: [string, 'null'] }
        ogFallbackImageUrl: { type: [string, 'null'] }
        crawlerGlobalNoindex: { type: boolean }
        googleExtendedAllowed: { type: boolean }
        aiCompatibilityFilesEnabled: { type: boolean }
        analyticsConsentRequired: { type: boolean }
        ga4Enabled: { type: boolean }
        ga4MeasurementId: { type: [string, 'null'] }
        yandexMetricaEnabled: { type: boolean }
        yandexMetricaCounterId: { type: [string, 'null'] }
        rustAnalyticsEnabled:
          type: boolean
          description: >-
            Must stay false until the Rust analytics service's contract
            lands (not expected before October 2026) — flipping this true
            does not by itself make anything happen; no adapter exists yet.
        searchConsoleVerificationToken: { type: [string, 'null'] }
        yandexWebmasterVerificationToken: { type: [string, 'null'] }
        bingVerificationToken: { type: [string, 'null'] }
        indexNowEnabled: { type: boolean }
        merchantCenterEnabled:
          type: boolean
          description: >-
            Always false — rejected at write time until a real versioned
            sellable-offer (Merchant) model exists.
        updatedByUserId: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
    UpdatePlatformSettingsRequest:
      type: object
      required: [expectedVersion]
      description: >-
        Tri-state per field: omitted = unchanged, null = clears an optional
        field, a value replaces it.
      properties:
        expectedVersion: { type: integer }
        changeReason: { type: string, minLength: 1, maxLength: 500 }
        canonicalHost: { type: string, minLength: 1, maxLength: 255 }
        forceHttps: { type: boolean }
        stripTrailingSlash: { type: boolean }
        organizationName: { type: [string, 'null'] }
        organizationLegalName: { type: [string, 'null'] }
        organizationEmail: { type: [string, 'null'], format: email }
        organizationPhone: { type: [string, 'null'] }
        organizationAddress: { type: [string, 'null'] }
        organizationSameAs:
          type: [array, 'null']
          items: { type: string, format: uri }
        seoDefaultTitleTemplate: { type: [string, 'null'] }
        seoDefaultDescriptionFallback: { type: [string, 'null'] }
        ogFallbackImageUrl: { type: [string, 'null'], format: uri }
        crawlerGlobalNoindex: { type: boolean }
        googleExtendedAllowed: { type: boolean }
        aiCompatibilityFilesEnabled: { type: boolean }
        analyticsConsentRequired: { type: boolean }
        ga4Enabled: { type: boolean }
        ga4MeasurementId: { type: [string, 'null'] }
        yandexMetricaEnabled: { type: boolean }
        yandexMetricaCounterId: { type: [string, 'null'] }
        rustAnalyticsEnabled: { type: boolean }
        searchConsoleVerificationToken: { type: [string, 'null'] }
        yandexWebmasterVerificationToken: { type: [string, 'null'] }
        bingVerificationToken: { type: [string, 'null'] }
        indexNowEnabled: { type: boolean }
        merchantCenterEnabled:
          type: boolean
          description: Rejected (422) if set to true — see PlatformSettings.merchantCenterEnabled.
    PreviewPlatformSettingsRequest:
      type: object
      description: Same tri-state patch fields as UpdatePlatformSettingsRequest, minus expectedVersion/changeReason — this endpoint never writes.
      properties:
        canonicalHost: { type: string, minLength: 1, maxLength: 255 }
        forceHttps: { type: boolean }
        stripTrailingSlash: { type: boolean }
        organizationName: { type: [string, 'null'] }
        organizationLegalName: { type: [string, 'null'] }
        organizationEmail: { type: [string, 'null'], format: email }
        organizationPhone: { type: [string, 'null'] }
        organizationAddress: { type: [string, 'null'] }
        organizationSameAs:
          type: [array, 'null']
          items: { type: string, format: uri }
        seoDefaultTitleTemplate: { type: [string, 'null'] }
        seoDefaultDescriptionFallback: { type: [string, 'null'] }
        ogFallbackImageUrl: { type: [string, 'null'], format: uri }
        crawlerGlobalNoindex: { type: boolean }
        googleExtendedAllowed: { type: boolean }
        aiCompatibilityFilesEnabled: { type: boolean }
        analyticsConsentRequired: { type: boolean }
        ga4Enabled: { type: boolean }
        ga4MeasurementId: { type: [string, 'null'] }
        yandexMetricaEnabled: { type: boolean }
        yandexMetricaCounterId: { type: [string, 'null'] }
        rustAnalyticsEnabled: { type: boolean }
        searchConsoleVerificationToken: { type: [string, 'null'] }
        yandexWebmasterVerificationToken: { type: [string, 'null'] }
        bingVerificationToken: { type: [string, 'null'] }
        indexNowEnabled: { type: boolean }
        merchantCenterEnabled: { type: boolean }
    PlatformSettingsHistoryEntry:
      type: object
      required: [id, previousVersion, createdAt, previousCanonicalHost]
      properties:
        id: { type: string }
        previousVersion: { type: integer }
        changeReason: { type: [string, 'null'] }
        changedByUserId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        previousCanonicalHost:
          type: string
          description: A summary field from the stored snapshot, not the full previous settings state.
    PlatformSettingsPreview:
      type: object
      description: >-
        Read-only effective-output preview (search-visibility.md: "the UI
        previews effective metadata/JSON-LD/sitemap/redirect/hreflang
        output").
      required: [canonicalOrigin, robotsGlobalNoindex, integrationHealth]
      properties:
        canonicalOrigin: { type: string, format: uri }
        robotsGlobalNoindex: { type: boolean }
        organizationJsonLd:
          type: object
          description: Rendered Organization JSON-LD, or omitted when no organization name is set.
        integrationHealth:
          type: object
          required:
            - ga4
            - yandexMetrica
            - rustAnalytics
            - searchConsole
            - yandexWebmaster
            - bing
            - indexNow
            - merchantCenter
          properties:
            ga4: { type: string, enum: [enabled, disabled] }
            yandexMetrica: { type: string, enum: [enabled, disabled] }
            rustAnalytics: { type: string, enum: [enabled, disabled] }
            searchConsole: { type: string, enum: [verified, not_verified] }
            yandexWebmaster: { type: string, enum: [verified, not_verified] }
            bing: { type: string, enum: [verified, not_verified] }
            indexNow: { type: string, enum: [enabled, disabled] }
            merchantCenter: { type: string, enum: [enabled, disabled] }
    AdvertisingProvider:
      type: string
      description: CLAUDE.md's closed, named provider allowlist — never an open string.
      enum: [GOOGLE_ADS, YANDEX_DIRECT, MICROSOFT_ADS, META, LINKEDIN, TIKTOK]
    AdvertisingProviderConfig:
      type: object
      required: [provider, enabled, consentCategory, testMode, updatedAt, version]
      properties:
        provider:
          $ref: '#/components/schemas/AdvertisingProvider'
        enabled: { type: boolean }
        consentCategory: { type: string, enum: [ANALYTICS, ADVERTISING] }
        accountId: { type: [string, 'null'] }
        containerId: { type: [string, 'null'] }
        pixelId: { type: [string, 'null'] }
        credentialSecretRef:
          type: [string, 'null']
          description: >-
            The *name* of a deployment-secret-store entry — never a
            credential value.
        testMode: { type: boolean }
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
    UpdateAdvertisingProviderConfigRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer }
        reason: { type: string, minLength: 1, maxLength: 500 }
        enabled: { type: boolean }
        consentCategory: { type: string, enum: [ANALYTICS, ADVERTISING] }
        accountId: { type: [string, 'null'] }
        containerId: { type: [string, 'null'] }
        pixelId: { type: [string, 'null'] }
        credentialSecretRef: { type: [string, 'null'] }
        testMode: { type: boolean }
    OfferState:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    OfferAvailability:
      type: string
      enum: [IN_STOCK, OUT_OF_STOCK, PREORDER, BACKORDER, DISCONTINUED]
    TaxDisplayPolicy:
      type: string
      enum: [TAX_INCLUDED, TAX_EXCLUDED]
    OfferIneligibilityReason:
      type: string
      description: >-
        ADR-0019's closed reason set. MERCHANT_CENTER_DISABLED is always
        present while PlatformSettings.merchantCenterEnabled stays
        hard-false.
      enum:
        - NOT_PUBLISHED
        - PRODUCT_NOT_DIRECT_SALE_ENABLED
        - PRODUCT_RETIRED
        - PRODUCT_NOT_PUBLISHED
        - EXPIRED
        - NOT_YET_EFFECTIVE
        - DISCONTINUED
        - MERCHANT_CENTER_DISABLED
    Offer:
      type: object
      required:
        - id
        - productId
        - state
        - sellerName
        - priceAmountMinor
        - currency
        - taxDisplayPolicy
        - availability
        - sku
        - eligibleCountries
        - effectiveFrom
        - updatedAt
        - version
      properties:
        id: { type: string }
        productId: { type: string }
        state:
          $ref: '#/components/schemas/OfferState'
        sellerName: { type: string }
        sellerUrl: { type: [string, 'null'] }
        priceAmountMinor: { type: integer }
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217, e.g. "USD".
        taxDisplayPolicy:
          $ref: '#/components/schemas/TaxDisplayPolicy'
        availability:
          $ref: '#/components/schemas/OfferAvailability'
        availableFrom: { type: [string, 'null'], format: date-time }
        inventoryQuantity: { type: [integer, 'null'] }
        sku: { type: string }
        gtin: { type: [string, 'null'] }
        mpn: { type: [string, 'null'] }
        brand: { type: [string, 'null'] }
        eligibleCountries:
          type: array
          items: { type: string, minLength: 2, maxLength: 2 }
        deliveryPolicyRef: { type: [string, 'null'] }
        returnPolicyRef: { type: [string, 'null'] }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: [string, 'null'], format: date-time }
        checkoutUrl:
          type: [string, 'null']
          description: >-
            Present only when purchasable; absent is the explicit
            not-yet-purchasable state. Required for state: PUBLISHED.
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
    CreateOfferRequest:
      type: object
      required:
        - productId
        - sellerName
        - priceAmountMinor
        - currency
        - taxDisplayPolicy
        - availability
        - sku
        - eligibleCountries
        - effectiveFrom
      properties:
        productId: { type: string }
        sellerName: { type: string, minLength: 1 }
        sellerUrl: { type: string, format: uri }
        priceAmountMinor: { type: integer }
        currency: { type: string, minLength: 3, maxLength: 3 }
        taxDisplayPolicy:
          $ref: '#/components/schemas/TaxDisplayPolicy'
        availability:
          $ref: '#/components/schemas/OfferAvailability'
        availableFrom: { type: string, format: date-time }
        inventoryQuantity: { type: integer, minimum: 0 }
        sku: { type: string, minLength: 1 }
        gtin: { type: string, minLength: 1 }
        mpn: { type: string, minLength: 1 }
        brand: { type: string, minLength: 1 }
        eligibleCountries:
          type: array
          items: { type: string, minLength: 2, maxLength: 2 }
        deliveryPolicyRef: { type: string, minLength: 1 }
        returnPolicyRef: { type: string, minLength: 1 }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time }
        checkoutUrl: { type: string, format: uri }
        reason: { type: string, minLength: 1, maxLength: 500 }
    UpdateOfferRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer }
        reason: { type: string, minLength: 1, maxLength: 500 }
        state:
          $ref: '#/components/schemas/OfferState'
        sellerName: { type: string, minLength: 1 }
        sellerUrl: { type: [string, 'null'] }
        priceAmountMinor: { type: integer }
        currency: { type: string, minLength: 3, maxLength: 3 }
        taxDisplayPolicy:
          $ref: '#/components/schemas/TaxDisplayPolicy'
        availability:
          $ref: '#/components/schemas/OfferAvailability'
        availableFrom: { type: [string, 'null'], format: date-time }
        inventoryQuantity: { type: [integer, 'null'], minimum: 0 }
        sku: { type: string, minLength: 1 }
        gtin: { type: [string, 'null'] }
        mpn: { type: [string, 'null'] }
        brand: { type: [string, 'null'] }
        eligibleCountries:
          type: array
          items: { type: string, minLength: 2, maxLength: 2 }
        deliveryPolicyRef: { type: [string, 'null'] }
        returnPolicyRef: { type: [string, 'null'] }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: [string, 'null'], format: date-time }
        checkoutUrl: { type: [string, 'null'] }
    AnalyticsConsentState:
      type: object
      required: [analytics, advertising]
      additionalProperties: false
      properties:
        analytics: { type: boolean }
        advertising: { type: boolean }
    AnalyticsEventBase:
      type: object
      required: [eventId, schemaVersion, occurredAt, sessionId, locale, consent, eventName]
      properties:
        eventId: { type: string, minLength: 1, maxLength: 128 }
        schemaVersion: { type: integer, enum: [1] }
        occurredAt: { type: string, format: date-time }
        sessionId:
          type: string
          minLength: 1
          maxLength: 128
          description: Anonymous, stable per browser-tab session — never a user identity.
        locale: { type: string, enum: [en, ru, uz] }
        consent:
          $ref: '#/components/schemas/AnalyticsConsentState'
    AnalyticsEvent:
      description: >-
        A closed, strict discriminated union on `eventName` — no
        unknown/extra field is accepted on any variant (never PII).
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/AnalyticsEventBase'
            - type: object
              required: [eventName, pageType, canonicalPath]
              additionalProperties: false
              properties:
                eventName: { const: page_view }
                pageType:
                  type: string
                  enum: [home, category, product, article, page, faq, catalog, other]
                canonicalPath: { type: string, minLength: 1, maxLength: 2048 }
        - allOf:
            - $ref: '#/components/schemas/AnalyticsEventBase'
            - type: object
              required: [eventName, productPublicId]
              additionalProperties: false
              properties:
                eventName: { const: view_item }
                productPublicId: { type: string, minLength: 1, maxLength: 64 }
        - allOf:
            - $ref: '#/components/schemas/AnalyticsEventBase'
            - type: object
              required: [eventName, resultCount]
              additionalProperties: false
              properties:
                eventName: { const: view_item_list }
                categoryId: { type: string, minLength: 1, maxLength: 64 }
                resultCount: { type: integer, minimum: 0 }
        - allOf:
            - $ref: '#/components/schemas/AnalyticsEventBase'
            - type: object
              required: [eventName]
              additionalProperties: false
              properties:
                eventName: { const: rfq_start }
                productPublicId: { type: string, minLength: 1, maxLength: 64 }
        - allOf:
            - $ref: '#/components/schemas/AnalyticsEventBase'
            - type: object
              required: [eventName, orderNumber]
              additionalProperties: false
              properties:
                eventName: { const: rfq_submit }
                orderNumber:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: The public order identifier — never the internal order UUID.
        - allOf:
            - $ref: '#/components/schemas/AnalyticsEventBase'
            - type: object
              required: [eventName, context]
              additionalProperties: false
              properties:
                eventName: { const: phone_click }
                context: { type: string, enum: [header, footer, contact_page, product] }
    RecordAnalyticsEventsRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/AnalyticsEvent'
