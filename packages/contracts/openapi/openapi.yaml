  /api/admin/products/{productId}/assets:
    get:
      operationId: listProductAssets
      summary: List every image/document attached to a product, all statuses (catalog.write)
      tags: [Product Assets]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: All assets for the product, ordered by sortOrder.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
    post:
      operationId: uploadProductAsset
      summary: Upload a product image/document (catalog.write)
      description: >-
        Validated against the allowlisted MIME/extension/magic-byte
        signature triple, then malware-scanned, before ever reaching
        storage. Never accepts a client-supplied assetType or storage path —
        assetType is inferred from the validated content type, and the
        storage key is always generated server-side.
      tags: [Product Assets]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                displayName: { type: string }
                locale:
                  $ref: '#/components/schemas/LocaleCode'
                altText: { type: string }
                caption: { type: string }
      responses:
        '201':
          description: The created asset (status DRAFT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          description: The referenced productId does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: >-
            Rejected by validation (disallowed content type, extension
            mismatch, signature mismatch, size limit) or malware scanning.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/admin/products/{productId}/assets/{assetId}:
    patch:
      operationId: updateProductAssetMetadata
      summary: Edit a product asset's editorial metadata (catalog.write)
      description: >-
        Never touches storageKey/checksum/scan fields — those are set once
        at upload time. altText/caption/locale accept null to clear them.
      tags: [Product Assets]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
        - name: assetId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductAssetMetadataRequest'
      responses:
        '200':
          description: The updated asset metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Stale version (concurrency conflict).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      operationId: removeProductAsset
      summary: Permanently remove a product asset (catalog.write)
      description: >-
        Irreversible: deletes the storage object, then the metadata row.
        Requires an explicit `{"confirm": true}` body — the anti-footgun for
        an irreversible action (CLAUDE.md: "Every destructive or sensitive
        action must require appropriate permission and confirmation").
      tags: [Product Assets]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
        - name: assetId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: boolean
                  enum: [true]
      responses:
        '204':
          description: The asset and its storage object were removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Missing or false `confirm`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
